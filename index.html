<!DOCTYPE html>
<html>

<head>
	<title>Sketchbook</title>
</head>

<body>
<div id="mp-name-modal" style="position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.72); display:flex; align-items:center; justify-content:center; font-family:monospace, sans-serif;">
	<div style="background:#1e1e1e; border:2px solid #555; border-radius:6px; padding:24px 28px; width:320px; text-align:center; color:white; box-shadow:0 8px 24px rgba(0,0,0,0.6);">
		<div style="font-size:18px; font-weight:bold; margin-bottom:14px;">Enter Your Name</div>
		<input id="mp-name-input" type="text" maxlength="16" placeholder="Player name..." style="width:100%; box-sizing:border-box; padding:10px; font-size:15px; border:1px solid #666; border-radius:4px; background:#111; color:white; outline:none; text-align:center; margin-bottom:14px;" />
		<button id="mp-join-btn" style="width:100%; padding:10px; font-size:15px; font-weight:bold; cursor:pointer; background:#3b8526; color:white; border:1px solid #52a535; border-radius:4px;">Join Game</button>
	</div>
</div>
<style>
  #mp-hud {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 100;
    width: 380px;
    font-family: 'Courier New', Consolas, monospace;
    color: #ffffff;
    user-select: none;
    pointer-events: none;
  }
  #mp-top-bar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 6px;
    pointer-events: auto;
  }
  .mp-btn {
    padding: 5px 10px;
    font-family: 'Courier New', Consolas, monospace;
    font-size: 12px;
    font-weight: bold;
    color: #fff;
    background: rgba(0, 0, 0, 0.65);
    border: 1.5px solid #666;
    cursor: pointer;
    text-shadow: 1px 1px 0 #000;
  }
  .mp-btn:hover {
    background: rgba(40, 40, 40, 0.85);
    border-color: #aaa;
  }
  #mp-chat-log {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 200px;
    overflow: hidden;
    margin-bottom: 4px;
    pointer-events: none;
  }
  #mp-chat-log.chat-open {
    overflow-y: auto;
    pointer-events: auto;
    background: rgba(0, 0, 0, 0.35);
    padding: 4px;
  }
  .mc-chat-line {
    background: rgba(0, 0, 0, 0.5);
    padding: 3px 6px;
    font-size: 14px;
    font-weight: bold;
    line-height: 1.3;
    text-shadow: 1.5px 1.5px 0px #000;
    word-break: break-word;
    opacity: 1;
    transition: opacity 1s ease;
  }
  .mc-chat-line.faded {
    opacity: 0;
  }
  #mp-chat-log.chat-open .mc-chat-line {
    opacity: 1 !important;
    transition: none !important;
  }
  #mp-chat-input-row {
    display: none;
    pointer-events: auto;
  }
  #mp-chat-input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    font-family: 'Courier New', Consolas, monospace;
    font-size: 14px;
    font-weight: bold;
    color: #fff;
    background: rgba(0, 0, 0, 0.78);
    border: 1.5px solid #888;
    outline: none;
    text-shadow: 1px 1px 0 #000;
  }
</style>

<div id="mp-hud">
  <div id="mp-top-bar">
    <button id="mp-voice-btn" class="mp-btn">Mic: OFF (M)</button>
    <button id="mp-invite-btn" class="mp-btn">Copy Invite Link</button>
  </div>
  <div id="mp-chat-log"></div>
  <div id="mp-chat-input-row">
    <input id="mp-chat-input" type="text" maxlength="140" autocomplete="off" placeholder="Write message and press Enter..." />
  </div>
</div>
	<script src="build/sketchbook.min.js"></script>
	<script>
		const world = new Sketchbook.World('build/assets/world.glb');
	</script>
</body>

</html>
